---
deployment:
  tasks:
    # 0) Chemin de déploiement (publier à la racine du site)
    - export DEPLOYPATH=/home/ketu3725/public_html

    # 1) Choisir une version de Node disponible sur le serveur (22 puis 20)
    - if [ -x /opt/cpanel/ea-nodejs22/bin/node ]; then export PATH=/opt/cpanel/ea-nodejs22/bin:$PATH; elif [ -x /opt/cpanel/ea-nodejs20/bin/node ]; then export PATH=/opt/cpanel/ea-nodejs20/bin:$PATH; fi
    - node -v || echo "Node introuvable dans PATH"

    # 2) Activer Corepack si présent (pnpm via Corepack). Ne casse pas si indispo.
    - if command -v corepack >/dev/null 2>&1; then corepack enable; corepack prepare pnpm@latest --activate || true; fi

    # 3) Installer dépendances (pnpm si dispo, sinon npm). Respecte le lockfile si présent.
    - if command -v pnpm >/dev/null 2>&1; then
        echo "Using pnpm";
        if [ -f "pnpm-lock.yaml" ]; then pnpm install --frozen-lockfile; else pnpm install; fi;
      else
        echo "pnpm indisponible, fallback npm";
        if [ -f "package-lock.json" ]; then npm ci; else npm install; fi;
      fi

    # 4) Build (pnpm si dispo, sinon npm)
    - if command -v pnpm >/dev/null 2>&1; then pnpm run build; else npm run build; fi

    # 5) Vérifier que dist/ existe (sécurité)
    - if [ ! -d "dist" ]; then echo "Build manquant: dossier dist/ introuvable" >&2; exit 1; fi

    # 6) Déployer dist/ -> public_html (sync propre)
    - /usr/bin/rsync -av --delete --exclude=".git" --exclude=".cpanel.yml" dist/ $DEPLOYPATH/
